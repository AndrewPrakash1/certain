[project]
name = "certain"
version = "0.1.0"
description = "Certificate-enforced reasoning: pay the model only when the proof runs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CERTAIN" }]

[project.optional-dependencies]
gpu = ["aligntune", "curatorkit", "auditkit"]

[tool.setuptools.packages.find]
include = ["certain*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
